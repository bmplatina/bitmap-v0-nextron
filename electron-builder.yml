productName: Bitmap
appId: com.prodbybitmap.esd

publish:
  - provider: github
    repo: bitmap-v0-nextron
    owner: bmplatina

directories:
  output: dist
  buildResources: resources

dmg:
  title: Bitmap

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Bitmap

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: x64
  extraResources:
    - from: resources/win32
      to: bin
      filter:
        - "**/*"
  publish:
    # an object provider for github with additional options
    - provider: github
      protocol: https

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: resources/Bitmap_IconComposer.icon
  publish:
    # an object provider for github with additional options
    - provider: github
      protocol: https
  extraResources:
    - from: resources/darwin
      to: bin
      filter:
        - "**/*"

linux:
  icon: resources/Bitmap_IconComposer.icon/Assets/BitmapWhite.png
  target:
    - snap

files:
  - from: .
    filter:
      - package.json
      - app
  - "!build"
  - "!dist"
  - "!scripts"
  - "!.idea"
  - "!.vscode"

protocols:
  name: Bitmap
  schemes: ["bitmap"]
