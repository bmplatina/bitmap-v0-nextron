productName: Bitmap
appId: com.prodbybitmap.esd

publish:
  - provider: github
    repo: bitmap-v0-nextron
    owner: bmplatina

directories:
  output: dist
  buildResources: resources

dmg:
  title: Bitmap

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Bitmap

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: x64

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: resources/Bitmap_IconComposer.icon

linux:
  target:
    - snap

files:
  - from: .
    filter:
      - package.json
      - app
  - "!build"
  - "!dist"
  - "!scripts"
  - "!.idea"
  - "!.vscode"

protocols:
  name: Bitmap
  schemes: ["bitmap"]
