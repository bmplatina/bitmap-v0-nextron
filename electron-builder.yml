productName: Bitmap
appId: com.prodbybitmap.esd

publish:
  - provider: github
    repo: bitmap
    owner: bmplatina

directories:
  output: dist
  buildResources: resources

dmg:
  title: Bitmap

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Bitmap

win:
  icon: assets/AppIcon.ico
  target:
    - target: nsis
      arch: x64

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [universal]
  icon: assets/AppIcon.icns

linux:
  target:
    - snap

files:
  - from: .
    filter:
      - package.json
      - app
  - '!build'
  - '!dist'
  - '!scripts'
  - '!.idea'
  - '!.vscode'

protocols:
  name: Bitmap
  schemes: ["bitmap"]